name = "pixelhoops-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

routes = [
  { pattern = "pixelhoops.kccecil.com", custom_domain = true },
  { pattern = "pixelhoops-api.kccecil.com", custom_domain = true },
]

[assets]
directory = ".."
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "pixelhoops-db"
database_id = "d98e7312-ab35-4a37-bd87-6f9517c59c12"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomRelay"

[[migrations]]
tag = "v1-room-relay"
new_sqlite_classes = ["RoomRelay"]
